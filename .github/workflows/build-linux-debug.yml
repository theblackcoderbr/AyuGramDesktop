name: Linux Debug build

on:
  workflow_dispatch:
    inputs:
      upload_binary:
        description: "Upload the built Telegram binary"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - "feat/**"

concurrency:
  group: linux-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_TAG: tdesktop:centos_env

jobs:
  libraries:
    name: Libraries image
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Dockerfile
        shell: bash
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.os }}-libs-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Build libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: false
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf "${{ runner.temp }}/.buildx-cache"
          mv "${{ runner.temp }}/.buildx-cache-new" "${{ runner.temp }}/.buildx-cache"

  build:
    name: Compile (Debug)
    needs: libraries
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Generate Dockerfile
        shell: bash
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "CCACHE_HOST_DIR=$RUNNER_TEMP/.tdesktop-cache" >> "$GITHUB_ENV"
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore libraries cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          fail-on-cache-miss: true

      - name: Load libraries image
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ccache-linux-debug-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-debug-${{ github.ref_name }}-
            ccache-linux-debug-

      - name: Build
        shell: bash
        run: |
          mkdir -p "$CCACHE_HOST_DIR"
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$CCACHE_HOST_DIR:/var/cache/ccache" \
            -e CONFIG=Debug \
            -e KEEP_GOING=1 \
            -e CCACHE_MAXSIZE=3G \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            "$IMAGE_TAG" \
            env -u CCACHE_DISABLE \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D TDESKTOP_API_TEST=ON \
            2>&1 | tee build.log

      - name: Summarize errors
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "The build step did not run; see the earlier failed step."
            exit 0
          fi
          errors=$(grep -E -A8 "CMake Error|\[ERROR\]" build.log | head -n 80 || true)
          errors+=$'\n'$(grep -E "error:|undefined reference|Error [0-9]+" build.log \
            | head -n 120 || true)
          if [ -z "${errors//[[:space:]]/}" ]; then
            errors=$(tail -n 80 build.log)
          fi
          {
            echo "## Build errors"
            echo '```'
            echo "$errors"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message=${errors//'%'/'%25'}
          message=${message//$'\r'/'%0D'}
          message=${message//$'\n'/'%0A'}
          echo "::error title=Build failed::${message:0:60000}"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: ccache-linux-debug-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload binary
        if: success() && inputs.upload_binary
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-debug
          path: out/Debug/Telegram
          retention-days: 3
